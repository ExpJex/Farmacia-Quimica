<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verb Quest - Trivia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .coins-display {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .verb-display {
            text-align: center;
            margin: 30px 0;
        }

        .spanish-verb {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            min-height: 54px;
        }

        .status-message {
            font-size: 14px;
            color: var(--text-muted);
            min-height: 21px;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #334155;
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .correct {
            border-color: var(--success) !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3) !important;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-check {
            background: var(--success);
            color: white;
        }

        .btn-check:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .store-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent);
            text-align: center;
        }

        .store-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .store-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-name {
            font-weight: 600;
            font-size: 14px;
        }

        .item-cost {
            color: var(--accent);
            font-size: 14px;
            font-weight: 800;
        }

        .btn-buy {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-buy:hover {
            background: var(--accent);
            color: var(--bg-color);
        }

        .active-buffs {
            margin-top: 15px;
            font-size: 12px;
            color: var(--success);
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .inputs-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel">
            <div class="header">
                <div class="title">Trivia de Verbos</div>
                <div class="coins-display">
                    🪙 <span id="coin-count">0</span>
                </div>
            </div>

            <div class="verb-display">
                <div class="spanish-verb" id="es-verb">Presiona el botón</div>
                <div class="status-message" id="status-msg">Para comenzar a jugar</div>
            </div>

            <div class="inputs-grid">
                <div class="input-group">
                    <label>Infinitive</label>
                    <input type="text" id="infinitive" autocomplete="off" disabled>
                </div>
                <div class="input-group">
                    <label>Past Simple</label>
                    <input type="text" id="past" autocomplete="off" disabled>
                </div>
                <div class="input-group">
                    <label>Past Participle</label>
                    <input type="text" id="participle" autocomplete="off" disabled>
                </div>
            </div>

            <button class="btn btn-primary" id="btn-random">🎲 Verbo Aleatorio</button>
            <button class="btn btn-check" id="btn-check" disabled>✓ Comprobar Respuestas</button>
        </div>

        <div class="panel">
            <div class="store-title">🏪 Tienda</div>
            
            <div class="store-item">
                <div class="store-item-header">
                    <span class="item-name">💡 Pista de Letra</span>
                    <span class="item-cost">15 🪙</span>
                </div>
                <button class="btn-buy" onclick="buyHint()">Comprar</button>
            </div>

            <div class="store-item">
                <div class="store-item-header">
                    <span class="item-name">✨ Revelar Verbo</span>
                    <span class="item-cost">40 🪙</span>
                </div>
                <button class="btn-buy" onclick="buyReveal()">Comprar</button>
            </div>

            <div class="store-item">
                <div class="store-item-header">
                    <span class="item-name">🔥 Multiplicador x2</span>
                    <span class="item-cost">60 🪙</span>
                </div>
                <button class="btn-buy" onclick="buyMultiplier()">Comprar</button>
            </div>

            <div class="active-buffs" id="active-buffs"></div>
        </div>
    </div>

    <script>
        const verbsDB = [
            { es: "ser / estar", v1: ["be"], v2: ["was", "were", "was/were"], v3: ["been"] },
            { es: "convertirse", v1: ["become"], v2: ["became"], v3: ["become"] },
            { es: "empezar", v1: ["begin"], v2: ["began"], v3: ["begun"] },
            { es: "morder", v1: ["bite"], v2: ["bit"], v3: ["bitten"] },
            { es: "romper", v1: ["break"], v2: ["broke"], v3: ["broken"] },
            { es: "traer", v1: ["bring"], v2: ["brought"], v3: ["brought"] },
            { es: "construir", v1: ["build"], v2: ["built"], v3: ["built"] },
            { es: "comprar", v1: ["buy"], v2: ["bought"], v3: ["bought"] },
            { es: "atrapar", v1: ["catch"], v2: ["caught"], v3: ["caught"] },
            { es: "elegir", v1: ["choose"], v2: ["chose"], v3: ["chosen"] },
            { es: "venir", v1: ["come"], v2: ["came"], v3: ["come"] },
            { es: "costar", v1: ["cost"], v2: ["cost"], v3: ["cost"] },
            { es: "cortar", v1: ["cut"], v2: ["cut"], v3: ["cut"] },
            { es: "hacer", v1: ["do"], v2: ["did"], v3: ["done"] },
            { es: "dibujar", v1: ["draw"], v2: ["drew"], v3: ["drawn"] },
            { es: "beber", v1: ["drink"], v2: ["drank"], v3: ["drunk"] },
            { es: "conducir", v1: ["drive"], v2: ["drove"], v3: ["driven"] },
            { es: "comer", v1: ["eat"], v2: ["ate"], v3: ["eaten"] },
            { es: "caer", v1: ["fall"], v2: ["fell"], v3: ["fallen"] },
            { es: "sentir", v1: ["feel"], v2: ["felt"], v3: ["felt"] },
            { es: "encontrar", v1: ["find"], v2: ["found"], v3: ["found"] },
            { es: "volar", v1: ["fly"], v2: ["flew"], v3: ["flown"] },
            { es: "olvidar", v1: ["forget"], v2: ["forgot"], v3: ["forgotten"] },
            { es: "obtener", v1: ["get"], v2: ["got"], v3: ["got"] },
            { es: "dar", v1: ["give"], v2: ["gave"], v3: ["given"] },
            { es: "ir", v1: ["go"], v2: ["went"], v3: ["gone"] },
            { es: "crecer", v1: ["grow"], v2: ["grew"], v3: ["grown"] },
            { es: "tener", v1: ["have"], v2: ["had"], v3: ["had"] },
            { es: "escuchar", v1: ["hear"], v2: ["heard"], v3: ["heard"] },
            { es: "esconder", v1: ["hide"], v2: ["hid"], v3: ["hidden"] },
            { es: "golpear", v1: ["hit"], v2: ["hit"], v3: ["hit"] },
            { es: "mantener", v1: ["keep"], v2: ["kept"], v3: ["kept"] },
            { es: "saber / conocer", v1: ["know"], v2: ["knew"], v3: ["known"] },
            { es: "dejar", v1: ["leave"], v2: ["left"], v3: ["left"] },
            { es: "perder", v1: ["lose"], v2: ["lost"], v3: ["lost"] },
            { es: "fabricar", v1: ["make"], v2: ["made"], v3: ["made"] },
            { es: "conocer / reunirse", v1: ["meet"], v2: ["met"], v3: ["met"] },
            { es: "pagar", v1: ["pay"], v2: ["paid"], v3: ["paid"] },
            { es: "poner", v1: ["put"], v2: ["put"], v3: ["put"] },
            { es: "leer", v1: ["read"], v2: ["read"], v3: ["read"] },
            { es: "correr", v1: ["run"], v2: ["ran"], v3: ["run"] },
            { es: "decir", v1: ["say"], v2: ["said"], v3: ["said"] },
            { es: "ver", v1: ["see"], v2: ["saw"], v3: ["seen"] },
            { es: "vender", v1: ["sell"], v2: ["sold"], v3: ["sold"] },
            { es: "enviar", v1: ["send"], v2: ["sent"], v3: ["sent"] },
            { es: "cantar", v1: ["sing"], v2: ["sang"], v3: ["sung"] },
            { es: "sentarse", v1: ["sit"], v2: ["sat"], v3: ["sat"] },
            { es: "dormir", v1: ["sleep"], v2: ["slept"], v3: ["slept"] },
            { es: "hablar", v1: ["speak"], v2: ["spoke"], v3: ["spoken"] },
            { es: "gastar", v1: ["spend"], v2: ["spent"], v3: ["spent"] },
            { es: "nadar", v1: ["swim"], v2: ["swam"], v3: ["swum"] },
            { es: "tomar", v1: ["take"], v2: ["took"], v3: ["taken"] },
            { es: "enseñar", v1: ["teach"], v2: ["taught"], v3: ["taught"] },
            { es: "contar", v1: ["tell"], v2: ["told"], v3: ["told"] },
            { es: "pensar", v1: ["think"], v2: ["thought"], v3: ["thought"] },
            { es: "entender", v1: ["understand"], v2: ["understood"], v3: ["understood"] },
            { es: "ganar", v1: ["win"], v2: ["won"], v3: ["won"] },
            { es: "escribir", v1: ["write"], v2: ["wrote"], v3: ["written"] }
        ];

        let currentCoins = 0;
        let activeVerb = null;
        let isMultiplierActive = false;
        let verbCompleted = false;

        const esVerbEl = document.getElementById('es-verb');
        const statusMsgEl = document.getElementById('status-msg');
        const coinCountEl = document.getElementById('coin-count');
        const infInput = document.getElementById('infinitive');
        const pastInput = document.getElementById('past');
        const partInput = document.getElementById('participle');
        const btnRandom = document.getElementById('btn-random');
        const btnCheck = document.getElementById('btn-check');
        const activeBuffsEl = document.getElementById('active-buffs');

        btnRandom.addEventListener('click', generateRandomVerb);
        btnCheck.addEventListener('click', checkAnswers);

        function generateRandomVerb() {
            const randomIndex = Math.floor(Math.random() * verbsDB.length);
            activeVerb = verbsDB[randomIndex];
            verbCompleted = false;

            esVerbEl.textContent = activeVerb.es;
            statusMsgEl.textContent = "Escribe las tres formas del verbo";
            statusMsgEl.style.color = "var(--text-muted)";

            [infInput, pastInput, partInput].forEach(input => {
                input.value = "";
                input.disabled = false;
                input.classList.remove('correct');
            });

            btnCheck.disabled = false;
        }

        function checkAnswers() {
            if (!activeVerb || verbCompleted) return;

            const valInf = infInput.value.toLowerCase().trim();
            const valPast = pastInput.value.toLowerCase().trim();
            const valPart = partInput.value.toLowerCase().trim();

            const isInfCorrect = activeVerb.v1.includes(valInf);
            const isPastCorrect = activeVerb.v2.includes(valPast);
            const isPartCorrect = activeVerb.v3.includes(valPart);

            if (isInfCorrect) infInput.classList.add('correct');
            if (isPastCorrect) pastInput.classList.add('correct');
            if (isPartCorrect) partInput.classList.add('correct');

            if (isInfCorrect && isPastCorrect && isPartCorrect) {
                verbCompleted = true;
                [infInput, pastInput, partInput].forEach(i => i.disabled = true);
                btnCheck.disabled = true;

                let reward = 10;
                if (isMultiplierActive) {
                    reward *= 2;
                    isMultiplierActive = false;
                    updateBuffDisplay();
                }

                currentCoins += reward;
                coinCountEl.textContent = currentCoins;
                
                statusMsgEl.textContent = `¡Excelente! Has ganado ${reward} 🪙`;
                statusMsgEl.style.color = "var(--success)";
            } else {
                statusMsgEl.textContent = "Algunas respuestas son incorrectas. ¡Inténtalo de nuevo!";
                statusMsgEl.style.color = "#ef4444";
            }
        }

        function buyHint() {
            if (currentCoins >= 15 && activeVerb && !verbCompleted) {
                currentCoins -= 15;
                coinCountEl.textContent = currentCoins;
                
                if (!infInput.classList.contains('correct')) {
                    infInput.value = activeVerb.v1[0].charAt(0) + "...";
                }
                if (!pastInput.classList.contains('correct')) {
                    pastInput.value = activeVerb.v2[0].charAt(0) + "...";
                }
                if (!partInput.classList.contains('correct')) {
                    partInput.value = activeVerb.v3[0].charAt(0) + "...";
                }
            }
        }

        function buyReveal() {
            if (currentCoins >= 40 && activeVerb && !verbCompleted) {
                currentCoins -= 40;
                coinCountEl.textContent = currentCoins;
                
                infInput.value = activeVerb.v1[0];
                pastInput.value = activeVerb.v2[0];
                partInput.value = activeVerb.v3[0];
                
                [infInput, pastInput, partInput].forEach(i => {
                    i.classList.add('correct');
                    i.disabled = true;
                });
                
                verbCompleted = true;
                btnCheck.disabled = true;
                statusMsgEl.textContent = "Verbo revelado. No se otorgan monedas en esta ronda.";
                statusMsgEl.style.color = "var(--accent)";
            }
        }

        function buyMultiplier() {
            if (currentCoins >= 60 && !isMultiplierActive) {
                currentCoins -= 60;
                coinCountEl.textContent = currentCoins;
                isMultiplierActive = true;
                updateBuffDisplay();
            }
        }

        function updateBuffDisplay() {
            if (isMultiplierActive) {
                activeBuffsEl.textContent = "¡Multiplicador x2 Activo para el próximo acierto!";
            } else {
                activeBuffsEl.textContent = "";
            }
        }
    </script>
</body>
</html>
